<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Bois de Serres</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Bandeau supérieur */
    header {
      background-color: #2e5d34;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Galerie */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery a {
      display: block;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }

    .gallery a:hover {
      transform: scale(1.03);
    }

    .gallery img {
	  width: 100%;
	  height: 350px;   /* 👈 plus grand */
	  object-fit: cover;
	  display: block;
}
    }
  </style>
</head>

<body>

  <header>
    Le Bois de Serres
  </header>

  <div class="gallery">

    <!-- Image 1 -->
    <a href="https://www.google.com/maps/search/?api=1&query=Bois+de+Serres" target="_blank">
      <img src="photos/bois1.jpg" alt="Bois de Serres">
    </a>

    <!-- Image 2 -->
    <a href="https://www.google.com/maps/search/?api=1&query=Bois+de+Serres" target="_blank">
      <img src="photos/bois2.jpg" alt="Sentier forêt">
    </a>

    <!-- Image 3 -->
    <a href="https://www.google.com/maps/search/?api=1&query=Bois+de+Serres" target="_blank">
      <img src="photos/bois3.png" alt="Nature">
    </a>

 
  </div>

</body>
</html>
